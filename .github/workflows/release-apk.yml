name: Build and publish RD Photo Resizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rd-photo-resizer-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Set Android compile SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.1.0
          name: RD Photo & Signature Resizer v1.1.0
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
