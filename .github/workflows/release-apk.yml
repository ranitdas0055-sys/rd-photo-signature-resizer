name: Build and publish RD Photo Resizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rd-photo-resizer-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((path for path in candidates if path.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = gradle_file.read_text()
          replacements = {
              "compileSdk = flutter.compileSdkVersion": "compileSdk = 36",
              "compileSdkVersion flutter.compileSdkVersion": "compileSdkVersion 36",
              "compileSdk flutter.compileSdkVersion": "compileSdk 36",
          }
          updated = source
          for old, new in replacements.items():
              updated = updated.replace(old, new)

          if updated == source and "compileSdk = 36" not in source and "compileSdkVersion 36" not in source and "compileSdk 36" not in source:
              raise SystemExit("Could not set compileSdk to 36; inspect generated Gradle file")

          gradle_file.write_text(updated)
          print(f"Using compileSdk 36 in {gradle_file}")
          PY
          grep -nE 'compileSdk|compileSdkVersion' android/app/build.gradle*
      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.app_version.outputs.version }}
          name: RD Photo Resizer v${{ steps.app_version.outputs.version }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish direct APK link
        run: |
          VERSION='${{ steps.app_version.outputs.version }}'
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-v${VERSION}/app-release.apk"
          {
            echo '### RD Photo Resizer APK'
            echo "Version: ${VERSION}"
            echo "[Download APK directly](${URL})"
          } >> "$GITHUB_STEP_SUMMARY"
