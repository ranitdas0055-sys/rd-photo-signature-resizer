name: Build and publish RD Photo Resizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rd-photo-resizer-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((path for path in candidates if path.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = gradle_file.read_text()
          patterns = [
              r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion",
              r"compileSdkVersion\\s+flutter\\.compileSdkVersion",
              r"compileSdk\\s+flutter\\.compileSdkVersion",
          ]
          updated = source
          for pattern in patterns:
              updated = re.sub(pattern, lambda match: match.group(0).split("flutter.")[0] + "36", updated)

          if updated == source and not re.search(r"compileSdk(?:Version)?\\s*(?:=\\s*)?36", source):
              raise SystemExit("Could not set compileSdk to 36; inspect generated Gradle file")
          gradle_file.write_text(updated)
          print(f"Using compileSdk 36 in {gradle_file}")
          PY
          grep -nE 'compileSdk|compileSdkVersion' android/app/build.gradle*

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.1.0
          name: RD Photo & Signature Resizer v1.1.0
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
